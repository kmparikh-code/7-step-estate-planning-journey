    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body {
      margin: 0;
      background: #FBF7EE;
      color: #1B2A4A;
      font-family: "Source Sans 3", Arial, sans-serif;
      font-size: 20px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; }
    button, a { touch-action: manipulation; }
    button:focus-visible, a:focus-visible {
      outline: 3px solid #1F6B45;
      outline-offset: 5px;
    }
    [hidden] { display: none !important; }
    .page-header {
      padding: 31px 24px 15px;
      text-align: center;
    }
    h1, h2, h3, .binder-caption { font-family: "Libre Baskerville", Georgia, serif; font-weight: 400; }
    h1 {
      max-width: 980px;
      margin: 0 auto;
      font-size: clamp(30px, 3.1vw, 43px);
      line-height: 1.3;
    }
    .page-header p {
      margin: 11px 0 0;
      font-size: clamp(18px, 1.55vw, 21px);
    }
    main { padding: 0 20px 30px; }
    .desk-figure {
      width: min(100%, 1400px);
      margin: 0 auto;
    }
    .desk-window {
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-x: contain;
      scroll-padding-inline: 12px;
      scrollbar-width: thin;
    }
    .desk-scene {
      position: relative;
      width: 100%;
      min-width: 640px;
      overflow: hidden;
      border: 1px solid rgba(27, 42, 74, 0.18);
      box-shadow: 0 10px 27px rgba(27, 42, 74, 0.14);
      background: #1B2A4A;
    }
    .desk-image {
      display: block;
      width: 100%;
      height: auto;
    }
    .desk-hotspots {
      position: absolute;
      inset: 0;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .step-item {
      position: absolute;
      width: clamp(128px, 12.5vw, 176px);
      height: clamp(78px, 7.35vw, 104px);
      transform: translate(-50%, -50%);
    }
    .step-item:nth-child(1) { left: 13%; top: 22%; }
    .step-item:nth-child(2) { left: 39%; top: 17%; }
    .step-item:nth-child(3) { left: 73%; top: 20%; }
    .step-item:nth-child(4) { left: 88%; top: 51%; }
    .step-item:nth-child(5) { left: 72%; top: 82%; }
    .step-item:nth-child(6) { left: 39%; top: 84%; }
    .step-item:nth-child(7) { left: 11%; top: 69%; }
    .desk-hotspot {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: 1px solid transparent;
      background: transparent;
      color: #1B2A4A;
      cursor: pointer;
    }
    .hotspot-label {
      position: absolute;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 48px;
      width: max-content;
      min-width: 132px;
      max-width: 192px;
      padding: 7px 12px;
      border: 1px solid rgba(27, 42, 74, 0.72);
      border-radius: 5px;
      background: rgba(251, 247, 238, 0.96);
      box-shadow: 0 3px 10px rgba(27, 42, 74, 0.17);
      color: #1B2A4A;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.16;
      text-align: left;
      transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
    }
    .hotspot-number {
      flex: 0 0 auto;
      color: #1F6B45;
      font-family: "Libre Baskerville", Georgia, serif;
      font-size: 22px;
      line-height: 1;
    }
    .hotspot-text { display: block; }
    .step-item:nth-child(1) .hotspot-label,
    .step-item:nth-child(2) .hotspot-label,
    .step-item:nth-child(3) .hotspot-label {
      bottom: calc(100% - 28px);
      left: 50%;
      transform: translateX(-50%);
    }
    .step-item:nth-child(4) .hotspot-label {
      top: 50%;
      right: 100%;
      transform: translateY(-50%);
    }
    .step-item:nth-child(5) .hotspot-label,
    .step-item:nth-child(6) .hotspot-label {
      top: calc(100% - 20px);
      left: 50%;
      transform: translateX(-50%);
    }
    .step-item:nth-child(7) .hotspot-label {
      top: 50%;
      left: 100%;
      transform: translateY(-50%);
    }
    .desk-hotspot:focus-visible { outline: none; }
    .desk-hotspot:focus-visible .hotspot-label { outline: 3px solid #1F6B45; outline-offset: 5px; }
    .binder-caption {
      margin: 17px 0 0;
      color: #1B2A4A;
      font-size: clamp(18px, 1.6vw, 22px);
      font-style: italic;
      line-height: 1.45;
      text-align: center;
    }
    .desk-pan-controls { display: flex; justify-content: center; gap: 12px; margin-top: 12px; }
    .desk-pan-button { min-height: 48px; padding: 10px 20px; border: 1px solid #1B2A4A; border-radius: 6px; background: #FBF7EE; color: #1B2A4A; font-size: 18px; cursor: pointer; }

    @media (max-width: 1100px) {

    }
    .site-footer { border-top: 1px solid #E5E0D7; background: #FBF7EE; padding: 28px 32px; }
    .footer-inner { display: flex; align-items: center; justify-content: space-between; gap: 48px; width: min(100%, 1400px); margin: 0 auto; }
    .legal { max-width: 600px; margin: 0; color: #5B6068; font-size: 14px; line-height: 1.6; }
    .footer-logo { display: block; width: 250px; max-width: 35%; height: auto; }
    .step-dialog {
      width: min(980px, calc(100vw - 64px));
      max-width: none;
      max-height: calc(100dvh - 64px);
      margin: auto;
      padding: 0;
      border: 1px solid #E3DDD0;
      border-radius: 18px;
      background: #FBF7EE;
      color: #1B2A4A;

      overflow: hidden;
    }
    .step-dialog::backdrop { background: rgba(17, 29, 49, 0.55); }
    .modal-frame { position: relative; display: flex; flex-direction: column; max-height: calc(100dvh - 66px); }
    .close-button {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      padding: 0;
      border: 1px solid #C7C5BD;
      border-radius: 50%;
      background: #FBF7EE;
      color: #1B2A4A;
      font-size: 34px;
      line-height: 1;

      transition: background 160ms ease, border-color 160ms ease;
    }
    .dialog-content { min-height: 0; padding: 46px 44px 32px; overflow-y: auto; overscroll-behavior: contain; }
    .dialog-intro { margin-bottom: 28px; padding-bottom: 26px; border-bottom: 2px solid #1F6B45; }
    .step-eyebrow { margin: 0 64px 10px 0; color: #1F6B45; font-size: 20px; font-weight: 600; }
    .dialog-heading { margin: 0 36px 18px 0; font-size: 46px; line-height: 1.2; }
    .dialog-heading:focus { outline: none; }
    .step-description { max-width: 65ch; margin: 0; font-size: 22px; line-height: 1.55; }
    .funding-callout {
      margin: 24px 0;
      padding: 26px 28px;

      border-left: 7px solid #1F6B45;

      background: #E8F0E8;

    }
    .funding-callout h3 { margin: 0 0 14px; font-family: "Source Sans 3", Arial, sans-serif; font-size: 26px; font-weight: 700; line-height: 1.3; }
    .funding-callout p { margin: 0; font-size: 21px; line-height: 1.55; }
    .work-sections { display: grid; grid-template-columns: 1.12fr 1fr; align-items: start; gap: 22px; }
    .work-section { padding: 24px; border: 1px solid #E5E0D7; border-radius: 10px; background: #FFFEFB; }
    .work-section h3 { margin: 0 0 20px; font-size: 25px; line-height: 1.4; }

    .work-section li::marker { color: #1F6B45; font-weight: 600; }
    .link-button { display: inline-flex; align-items: center; justify-content: center; min-height: 50px; margin-top: 26px; padding: 10px 22px; border: 1px solid #1F6B45; border-radius: 6px; background: #1F6B45; color: #FFFFFF; font-size: 19px; font-weight: 600; text-decoration: none; transition: background 160ms ease, box-shadow 160ms ease; }
    .dialog-navigation { display: flex; justify-content: space-between; gap: 20px; flex-shrink: 0; padding: 20px 44px; border-top: 1px solid #E0DACE; background: #FBF7EE; }
    .nav-button { min-width: 140px; min-height: 50px; padding: 10px 22px; border: 1px solid #1B2A4A; border-radius: 6px; background: #FFFEFB; color: #1B2A4A; font-size: 19px; font-weight: 600; cursor: pointer; transition: box-shadow 160ms ease, border-color 160ms ease; }

    @media (max-width: 959px) {

      .page-header { padding: 24px 20px 18px; }

      .page-header p { margin-top: 12px; font-size: 19px; }
      main { padding: 0 14px 36px; }
      .desk-figure { width: 100%; }
      .desk-scene { border-radius: 0; box-shadow: 0 6px 18px rgba(27, 42, 74, 0.13); }
      .binder-caption { margin: 16px 0 20px; font-size: 20px; }
      .site-footer { padding: 28px 22px; }
      .footer-inner { flex-direction: column; align-items: stretch; gap: 24px; }
      .footer-logo { align-self: flex-end; width: 220px; max-width: 80%; }
      .step-dialog { width: 100%; height: 100dvh; max-height: 100dvh; margin: 0; border: 0; border-radius: 0; }
      .modal-frame { height: 100dvh; max-height: 100dvh; }
      .dialog-content { flex: 1; padding: 32px 22px 28px; }
      .dialog-intro { margin-bottom: 24px; padding-bottom: 24px; }
      .step-eyebrow { margin-top: 0; margin-bottom: 10px; }
      .dialog-heading { margin-right: 0; font-size: clamp(32px, 8vw, 38px); }
      .step-description { font-size: 21px; }

    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }

</head>
<body>
  <header class="page-header">
    <h1>Your seven-step estate planning journey</h1>
    <p>Click any step to see what we do and what you do.</p>
  </header>
  <main>
    <figure class="desk-figure">
      <div class="desk-window" id="desk-window" role="region" aria-label="Interactive estate planning desk" tabindex="0">
        <div class="desk-scene">
          <picture>
            <source type="image/webp" srcset="estate-desk-768.webp 768w, estate-desk-1280.webp 1280w, estate-desk-2048.webp 2048w" sizes="(max-width: 668px) 640px, (max-width: 959px) calc(100vw - 28px), (max-width: 1440px) calc(100vw - 40px), 1400px">
            <img class="desk-image" src="estate-desk.jpg" alt="A navy Mossy Creek Wealth estate plan binder on a wooden desk." width="1600" height="900" fetchpriority="high" decoding="async">
          </picture>
          <ol class="desk-hotspots" id="scene-step-list" aria-label="Estate planning steps"></ol>
        </div>
      </div>
      <nav class="desk-pan-controls" id="desk-pan-controls" aria-label="Explore the desk image" hidden>
        <button class="desk-pan-button" id="desk-left" type="button">Move left</button>
        <button class="desk-pan-button" id="desk-right" type="button">Move right</button>
      </nav>
      <figcaption class="binder-caption">Your estate plan is more than a binder.</figcaption>
    </figure>
  </main>
  <footer class="site-footer">
    <div class="footer-inner">
      <p class="legal">Advisory services provided by Farther Finance Advisors LLC, an SEC-registered investment advisor.</p>
      <img class="footer-logo" src="mcw_logo_transparent.png" alt="Mossy Creek Wealth at Farther" width="2957" height="801" loading="lazy">
    </div>
  </footer>
  <dialog class="step-dialog" id="step-dialog" aria-labelledby="dialog-heading" aria-describedby="step-description">
    <div class="modal-frame">
      <button class="close-button" id="close-dialog" type="button" aria-label="Close">×</button>
      <div class="dialog-content" id="dialog-content">
        <header class="dialog-intro">
          <p class="step-eyebrow" id="step-eyebrow"></p>
          <h2 class="dialog-heading" id="dialog-heading" tabindex="-1"></h2>
          <aside class="funding-callout" id="funding-callout" aria-labelledby="funding-callout-heading" hidden>
            <h3 id="funding-callout-heading"></h3>
            <p id="funding-callout-text"></p>
          </aside>
          <p class="step-description" id="step-description"></p>
        </header>
        <div class="work-sections">
          <section class="work-section" aria-labelledby="we-heading">
            <h3 id="we-heading">What we do</h3>
            <ol id="we-list"></ol>
          </section>
          <section class="work-section" aria-labelledby="you-heading">
            <h3 id="you-heading">What you do</h3>
            <ol id="you-list"></ol>
          </section>
        </div>
        <a class="link-button" id="step-link" target="_blank" rel="noopener noreferrer" hidden></a>
      </div>
      <nav class="dialog-navigation" aria-label="Step navigation">
        <button class="nav-button" id="previous-step" type="button">Previous</button>
        <button class="nav-button next-button" id="next-step" type="button">Next step</button>
      </nav>
    </div>
  </dialog>
  <script>
    // SEVEN STEPS: EDIT ALL WORDING AND OPTIONAL LINKS IN THIS ARRAY.
    // Add a URL to link.url to show a link button. Leave it empty to hide it.
    // Each step can have its own link.label and link.url.
    const steps = [
      {
        label: "Get started",
        description: "Talk through your goals and how your plan will come together.",
        weDo: [
          "Talk through why a plan matters now, or why your existing plan needs updating.",
          "Explain your two paths: Farther's partnership with EncorEstate Plans, or your own estate attorney.",
          "Explain how it works: attorneys drafted the plan templates, and we complete them together with you. An attorney can be brought in if you need one."
        ],
        youDo: [
          "Complete your Estate Planning Kickoff form.",
          "Sign a short disclosure that explains how the process works."
        ],
        link: { label: "Watch Trent's video", url: "" }
      },
      {
        label: "Share your wishes",
        description: "Decide who inherits, how, and who makes decisions for you.",
        weDo: [
          "Go over the key questions with you: who inherits, how they receive it, who makes financial and medical decisions for you, and guardians for minor children.",
          "Schedule a one-hour drafting meeting with Farther's Trusts & Estates team, and join you for it.",
          "Enter your plan together in that meeting. Your documents come back in about five business days."
        ],
        youDo: [
          "Answer the questions with us, or ahead of time in your questionnaire if you prefer.",
          "Attend your drafting meeting."
        ],
        link: { label: "", url: "" }
      },
      {
        label: "Review and sign",
        description: "Check your documents, then sign them properly so they hold up.",
        weDo: [
          "Send your draft documents for review before anything is signed.",
          "Handle any changes for you. One round of edits is free within 90 days.",
          "Walk you through signing, notarizing, and witnessing.",
          "Keep copies of your signed documents on file."
        ],
        youDo: [
          "Review your documents and ask for any changes.",
          "Fill out your asset list, personal property list, and statement of wishes, if you'd like.",
          "Sign and notarize, then keep your originals somewhere safe."
        ],
        link: { label: "", url: "" }
      },
      {
        label: "Fund your plan",
        description: "Put your signed plan into action by completing the account, property, and beneficiary updates on your personal checklist.",
        callout: {
          heading: "Your estate plan is not complete until the funding work is done.",
          text: "Signing your documents does not automatically change account ownership or update your beneficiaries. Without completing these steps, some assets may still go through probate or pass to someone you did not intend. We guide you through the process, but your participation and follow-through are essential."
        },
        weDo: [
          "Create your personal funding checklist and explain what needs to happen for each asset.",
          "Help you understand which assets need an ownership change, a beneficiary update, or guidance from your estate attorney.",
          "Help with updates to accounts we manage and explain which actions you need to complete directly with outside institutions.",
          "Review the confirmations you provide, help you track unfinished items, and update your financial plan with anything new we find."
        ],
        youDo: [
          "Review your asset list. Tell us about all your accounts, properties, insurance policies, and business interests, including those held outside Farther. Provide current statements and ownership information as requested.",
          "Contact your outside institutions. Ask your banks, investment firms, and insurance companies what forms and supporting documents they require for the changes on your checklist.",
          "Complete and submit the paperwork. Follow your checklist, provide requested trust documents, and sign and return the required forms. Ask us about anything you do not understand before submitting it.",
          "Review your beneficiaries. Check the primary and backup beneficiaries on retirement accounts, life insurance, and other accounts with beneficiary designations. Make changes according to your plan, not simply by naming the trust on everything.",
          "Complete any property or business transfers on your checklist. Work with the appropriate attorney or professional, provide requested records, and sign or notarize documents as needed. Obtain confirmation that any required deed recording or ownership update is complete.",
          "Check your homeowners insurance. If your home is transferred into your trust, contact your homeowners insurance agent to make sure your policy covers both you and the trust appropriately.",
          "Follow up and provide confirmation. Check that each institution has accepted and completed your changes. Keep copies of updated statements, beneficiary confirmations, recorded deeds, and insurance updates, and share the relevant confirmations with us securely.",
          "Tell us what is still outstanding. Let us know if an institution rejects a form, requests more information, or delays a change so we can help you determine the next step."
        ],
        link: { label: "", url: "" }
      },
      {
        label: "See your plan",
        description: "Get a one-page picture of your plan, and choose who should hear about their role.",
        weDo: [
          "Send you a one-page visual summary of your plan: everyone you've named, and their role.",
          "Walk you through it so you know exactly what your plan says."
        ],
        youDo: [
          "Review your summary.",
          "Choose which of the people you named we may contact, and share their contact details.",
          "Decide on one group call with everyone, or separate calls."
        ],
        link: { label: "", url: "" }
      },
      {
        label: "Introduce your people",
        description: "Make sure the people you named know their role before it ever matters.",
        weDo: [
          "Record a short video with you that introduces Trent and tells your people when the call is.",
          "Send each person a secure link with your video and three quick questions.",
          "Hold a 30-minute call with you and your people to explain each role.",
          "Send each person a written explanation of their role, then check in about a month later."
        ],
        youDo: [
          "Give each person a quick heads-up first, by phone or text.",
          "Book the group call with your family using Trent's scheduling link.",
          "Record your video with Trent."
        ],
        link: { label: "", url: "" }
      },
      {
        label: "Keep it current",
        description: "Life changes, assets change, and laws change, so your plan should too.",
        weDo: [
          "Send you a short check-in once a year about life changes.",
          "Review your plan every three to five years, or sooner after a major life event.",
          "Update your plan when something changes, and let the people you named know if their role changes."
        ],
        youDo: [
          "Answer your yearly check-in.",
          "Tell us about big changes as they happen: a marriage, divorce, birth, or death, or a new property or business."
        ],
        link: { label: "", url: "" }
      }
    ];

    const sceneStepList = document.getElementById("scene-step-list");
    const deskWindow = document.getElementById("desk-window");
    const deskPanControls = document.getElementById("desk-pan-controls");
    const deskLeft = document.getElementById("desk-left");
    const deskRight = document.getElementById("desk-right");
    const dialog = document.getElementById("step-dialog");
    const closeButton = document.getElementById("close-dialog");
    const dialogContent = document.getElementById("dialog-content");
    const heading = document.getElementById("dialog-heading");
    const eyebrow = document.getElementById("step-eyebrow");
    const description = document.getElementById("step-description");
    const fundingCallout = document.getElementById("funding-callout");
    const fundingCalloutHeading = document.getElementById("funding-callout-heading");
    const fundingCalloutText = document.getElementById("funding-callout-text");
    const weList = document.getElementById("we-list");
    const youList = document.getElementById("you-list");
    const linkButton = document.getElementById("step-link");
    const previousButton = document.getElementById("previous-step");
    const nextButton = document.getElementById("next-step");
    let currentStep = 0;
    let returnFocusTo = null;
    let previousOverflow = "";
    let pointerStartedOutside = false;

    function fillList(list, items) {
      list.replaceChildren(...items.map((text) => {
        const item = document.createElement("li");
        item.textContent = text;
        return item;
      }));
    }

    function updateStepControls(index) {
      document.querySelectorAll("[data-step-index]").forEach((button) => {
        const isCurrent = Number(button.dataset.stepIndex) === index;
        button.classList.toggle("is-current", isCurrent);
        button.setAttribute("aria-current", isCurrent ? "step" : "false");
        button.setAttribute("aria-expanded", dialog.open && isCurrent ? "true" : "false");
      });
    }

    function showStep(index, moveFocus = true) {
      currentStep = index;
      const step = steps[index];
      eyebrow.textContent = `Step ${index + 1}`;
      heading.textContent = step.label;
      description.textContent = step.description;
      fundingCallout.hidden = !step.callout;
      fundingCalloutHeading.textContent = step.callout ? step.callout.heading : "";
      fundingCalloutText.textContent = step.callout ? step.callout.text : "";
      fillList(weList, step.weDo);
      fillList(youList, step.youDo);
      linkButton.hidden = true;
      linkButton.removeAttribute("href");
      if (step.link.url.trim() && step.link.label.trim()) {
        try {
          const url = new URL(step.link.url.trim(), document.baseURI);
          if (url.protocol === "https:" || url.protocol === "http:") {
            linkButton.href = step.link.url.trim();
            linkButton.textContent = step.link.label;
            linkButton.hidden = false;
          }
        } catch (error) {
          linkButton.hidden = true;
        }
      }
      previousButton.disabled = index === 0;
      nextButton.textContent = index === steps.length - 1 ? "Exit" : "Next step";
      dialogContent.scrollTop = 0;
      updateStepControls(index);
      if (moveFocus && dialog.open) heading.focus({ preventScroll: true });
    }

    function openStep(index, button) {
      returnFocusTo = button;
      showStep(index, false);
      previousOverflow = document.body.style.overflow;
      document.body.style.overflow = "hidden";
      dialog.showModal();
      updateStepControls(index);
      heading.focus({ preventScroll: true });
      dialogContent.scrollTop = 0;
    }

    function closeDialog() {
      if (dialog.open) dialog.close();
    }

    function createSceneControl(step, index) {
      const item = document.createElement("li");
      item.className = "step-item";
      const button = document.createElement("button");
      button.className = "desk-hotspot";
      button.type = "button";
      button.dataset.stepIndex = String(index);
      button.setAttribute("aria-label", `Step ${index + 1}: ${step.label}`);
      button.setAttribute("aria-haspopup", "dialog");
      button.setAttribute("aria-controls", "step-dialog");
      button.setAttribute("aria-expanded", "false");
      const label = document.createElement("span");
      label.className = "hotspot-label";
      const number = document.createElement("span");
      number.className = "hotspot-number";
      number.textContent = String(index + 1);
      const text = document.createElement("span");
      text.className = "hotspot-text";
      text.textContent = step.label;
      label.append(number, document.createTextNode(" "), text);
      button.append(label);
      button.addEventListener("click", () => openStep(index, button));
      item.append(button);
      return item;
    }

    steps.forEach((step, index) => {
      sceneStepList.append(createSceneControl(step, index));
    });

    function updateDeskPanControls() {
      const maximum = Math.max(0, deskWindow.scrollWidth - deskWindow.clientWidth);
      deskPanControls.hidden = maximum <= 1;
      deskLeft.disabled = deskWindow.scrollLeft <= 1;
      deskRight.disabled = deskWindow.scrollLeft >= maximum - 1;
    }
    let lastDeskWidth = 0;
    function sizeDeskWindow() {
      if (lastDeskWidth !== deskWindow.clientWidth) {
        deskWindow.scrollLeft = Math.max(0, (deskWindow.scrollWidth - deskWindow.clientWidth) / 2);
        lastDeskWidth = deskWindow.clientWidth;
      }
      updateDeskPanControls();
    }
    deskLeft.addEventListener("click", () => deskWindow.scrollBy({ left: -deskWindow.clientWidth * 0.7, behavior: "auto" }));
    deskRight.addEventListener("click", () => deskWindow.scrollBy({ left: deskWindow.clientWidth * 0.7, behavior: "auto" }));
    deskWindow.addEventListener("scroll", updateDeskPanControls, { passive: true });
    if (window.ResizeObserver) new ResizeObserver(sizeDeskWindow).observe(deskWindow);
    else window.addEventListener("resize", sizeDeskWindow);
    sizeDeskWindow();

    closeButton.addEventListener("click", closeDialog);
    previousButton.addEventListener("click", () => {
      if (currentStep > 0) showStep(currentStep - 1);
    });
    nextButton.addEventListener("click", () => {
      if (currentStep < steps.length - 1) showStep(currentStep + 1);
      else closeDialog();
    });
    dialog.addEventListener("cancel", (event) => {
      event.preventDefault();
      closeDialog();
    });
    dialog.addEventListener("close", () => {
      document.body.style.overflow = previousOverflow;
      document.querySelectorAll("[data-step-index]").forEach((button) => button.setAttribute("aria-expanded", "false"));
      if (returnFocusTo && returnFocusTo.isConnected) {
        const originalIndex = returnFocusTo.dataset.stepIndex;
        const visibleControl = returnFocusTo.getClientRects().length > 0 ? returnFocusTo :
          [...document.querySelectorAll(`[data-step-index="${originalIndex}"]`)]
            .find((button) => button.getClientRects().length > 0);
        if (visibleControl) visibleControl.focus({ preventScroll: true });
      }
    });

    function isOutsidePanel(event) {
      const bounds = dialog.getBoundingClientRect();
      return event.clientX < bounds.left || event.clientX > bounds.right ||
        event.clientY < bounds.top || event.clientY > bounds.bottom;
    }
    dialog.addEventListener("pointerdown", (event) => {
      pointerStartedOutside = isOutsidePanel(event);
    });
    dialog.addEventListener("click", (event) => {
      if (event.target === dialog && pointerStartedOutside && isOutsidePanel(event)) closeDialog();
      pointerStartedOutside = false;
    });
    dialog.addEventListener("keydown", (event) => {
      if (event.key !== "Tab") return;
      const focusable = [...dialog.querySelectorAll('button:not(:disabled), a[href], [tabindex="0"]')]
        .filter((element) => !element.hidden && element.getClientRects().length > 0);
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      const active = document.activeElement;
      if (!focusable.includes(active)) {
        event.preventDefault();
        (event.shiftKey ? last : first).focus();
      } else if (event.shiftKey && active === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && active === last) {
        event.preventDefault();
        first.focus();
      }
    });
